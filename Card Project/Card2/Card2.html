<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Project 2</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <img
                class="topImage"
                src="../Images/ChatGPT Image Jul 30, 2026, 08_10_34 PM.png"
                alt="Full stack development"
            >
            <img src="" alt="">

            <h2>Order Summary</h2>

            <p id="description">
                Upgrade your coding journey with structured projects,
                modern technologies, and practical full-stack development
                experience.
            </p>

            <div id="plan">

                <div class="planLeft">

                    <div class="imageBox">
                        <img
                            src="../Images/apple-music-logo-apple-music-logo-free-download-free-png.webp"
                            alt="Plan logo"
                        >
                    </div>

                    <div class="amountBox">
                        <p class="planName">Annual Plan</p>
                        <p class="price">$99.9/year</p>
                    </div>

                </div>

                <div class="rightBox">
                    <a href="#">Change</a>
                </div>

            </div>

            <button id="payment">
                Proceed to Payment
            </button>

            <div class="cancelBox">
                <a href="#">Cancel Order</a>
            </div>

        </div>

    </div>

</body>
</html>
