<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Complex Forms</h1>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name</label>
            <input type="text" name="name" id="name">
            <label for="email">Email</label>
            <input type="email" name="Takeemail" id="email">
            <label for="phoneNumber">Phone</label>
            <input type="number" name="Mobilenu" id="phoneNumber">
            <label for="dateofbirth">Date Of Birth</label>
            <input type="date" name="datepick" id="dateofbirth">
            <span>Gender</span>
            <input type="radio" name="radio" id="male">
            <label for="male">Male</label>
            <input type="radio" name="radio" id="Female">
            <label for="Female">Female</label>
            <label for="country">country</label>
            <select name="country" id="country">
                <option value="us" id="us">United State</option>
                <option value="India" id="India">India</option>
            </select>
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Adress Street</legend>
            <label for="CITYS">City</label>
            <input type="text" name="citysss" id="CITYS">
            <br><br>
            <label for="STATES">State</label>
            <input type="text" name="statesss" id="STATES">
            <br><br>
            <label for="zipcodee">Zip-Code</label>
            <input type="text" name="zipcodee" id="zipcodee">
            <br><br>
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Other Information</legend>
            <label for="Comments">Comments</label>
            <textarea name="Comments" id="Comments"></textarea>
            <br><br>
            <label for="aggry">I agree to the terms of service</label>
            <input type="checkbox" name="aggry" id="aggry">
            <br><br>
        </fieldset>
        <br>
        <input type="button" value="Submit">
    </form>
</body>
</html>
